const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('#mic').hidden=true;else $('#mic').onclick=listen;
let pending=[],spkOn=false,talkOn=false,dbp=null;
const getdb=()=>dbp||(dbp=(window.claude?claude.use('db'):Promise.resolve(null)).catch(()=>null));
async function logFb(v,why){try{const db=await getdb();if(db)await db.collection('feedback').add({v,why:why||'',mode,t:Date.now()})}catch(e){}}
function regen(ch,hint){ch.msgs.pop();const last={r:'a',t:''};ch.msgs.push(last);render();reply(ch,last,hint,null)}
function speak(t,done){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' code block. ').replace(/https?:\S+/g,'link').replace(/[*#`_]/g,''));u.onend=()=>done&&done();speechSynthesis.speak(u)}catch(e){done&&done()}}
function listen(){if(!SR)return;try{const r=new SR();r.onresult=e=>{const t=e.results[0][0].transcript;if(talkOn)send(t);else{$('#in').value+=t;grow()}};r.onend=()=>$('#mic').classList.remove('on');r.start();$('#mic').classList.add('on')}catch(e){$('#mic').hidden=true}}
function renderPend(){$('#pend').innerHTML=pending.map((a,i)=>`<button data-x="${i}">${a.blob?'🖼':'📄'} ${esc(a.name)} ×</button>`).join('')}
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){if(pending.length>=6)break;
if(f.type.startsWith('image/'))pending.push({name:f.name,blob:f});
else try{pending.push({name:f.name,text:(await f.text()).slice(0,30000)})}catch(x){}}
e.target.value='';renderPend()};
$('#pend').onclick=e=>{const i=e.target.dataset.x;if(i!==undefined){pending.splice(+i,1);renderPend()}};

if($('#ri').checked&&ch)rec.chat=ch.msgs.slice(-2).map(m=>m.t.slice(0,1500));
try{const db=await getdb();if(!db)throw 0;await db.collection('reports').add(rec);$('#rx').value='';$('#rm').textContent='Thanks. Your report was sent.';setTimeout(()=>$('#dlg').close(),1200)}
catch(e){$('#rm').textContent='Couldn’t send the report right now. Try again later.'}};
let thinkOn=false,mem=[],memOn=true,uid=null;
const clean=t=>(t||'').replace(/\[\[(?:remember|choices):[\s\S]*?\]\]/g,'').replace(/\[\[[^\]]*$/,'').trim();
function memInstr(){return memOn?' If the user shares a lasting fact or preference worth remembering, or asks you to remember something, end your reply with a line [[remember: short fact about the user]] (one per fact; never mention it; never save passwords, card or ID numbers).'+(mem.length?' What you remember about this user: '+mem.join('; ')+'.':''):''}
function harvest(m){const cm=/\[\[choices:([\s\S]*?)\]\]/.exec(m.t||'');if(cm){const p=cm[1].split('|').map(s=>s.trim()).filter(Boolean);if(p.length>2)m.ch={q:p[0],o:p.slice(1,6)}}const re=/\[\[remember:([\s\S]*?)\]\]/g;let x,add=0;
while(x=re.exec(m.t||'')){const f=x[1].trim().slice(0,200);if(memOn&&f&&mem.length<50&&!mem.some(y=>y.toLowerCase()===f.toLowerCase())){mem.push(f);add=1}}
m.t=clean(m.t);if(add)memSave()}
async function memSave(){try{localStorage.setItem('sn.mem',JSON.stringify(mem))}catch(e){}
try{if(uid){const db=await getdb();if(db)await db.collection('data/users/'+uid).doc('memory').set({facts:mem})}}catch(e){}}
async function memInit(){try{mem=JSON.parse(localStorage.getItem('sn.mem')||'[]');memOn=localStorage.getItem('sn.memoff')!=='1'}catch(e){}
try{const u=window.claude&&await claude.use('user'),db=await getdb();if(u&&db){uid=await u.id();if(uid){const d=await db.collection('data/users/'+uid).doc('memory').get();
if(d.exists)mem=(d.data().facts||[]).map(String);else if(mem.length)memSave()}}}catch(e){}}
memInit();
function memRender(){$('#mon').checked=memOn;$('#mlist').innerHTML=mem.length?mem.map((f,i)=>`<div class="mf"><span>${esc(f)}</span><button data-md="${i}" aria-label="Forget this">×</button></div>`).join(''):'<p>Nothing yet. Tell Supernova about yourself, or say “remember that…”.</p>'}

let sh=null;
const hard=t=>t.length>500||/```|prove|derive|step by step|debug|algorithm|compare|analy[sz]e|strategy|optimi[sz]e/i.test(t);
function b64(s){try{return btoa(unescape(encodeURIComponent(s)))}catch(e){return ''}}
function setMode(m){mode=m;[...$('#chips').children].forEach(b=>{if(!b.id)b.classList.toggle('on',b.textContent===m)})}
function chHtml(m,i,c){return m.ch&&i===c.msgs.length-1&&!busy?'<div class="mcq"><p>'+esc(m.ch.q)+'</p>'+m.ch.o.map((o,j)=>`<button data-ch="${j}">${esc(o)}</button>`).join('')+'</div>':''}
function previewDoc(text,code){const bk=[...text.matchAll(/```(\w*)\n?([\s\S]*?)```/g)].map(m=>[m[1].toLowerCase(),m[2]]);
let h=code;if(!/<html|<!doctype|<body/i.test(h))h='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;font-family:system-ui">'+h;
const css=bk.filter(b=>b[0]==='css').map(b=>b[1]).join('\n'),js=bk.filter(b=>b[0]==='js'||b[0]==='javascript').map(b=>b[1]).join('\n');
if(css&&!/<style/i.test(h))h+='<style>'+css+'</style>';if(js&&!/<script/i.test(h))h+='<script>'+js+'<\/script>';return h}
function openPrev(btn){const code=btn.closest('.code').querySelector('code').textContent,mi=+btn.closest('.m').dataset.i,ch=chats.find(x=>x.id===cur);$('#pf').srcdoc=previewDoc(ch?ch.msgs[mi].t:'',code);$('#pdlg').showModal()}

// starfield
const cv=$('#sky'),cx=cv.getContext('2d');let W,H,st=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;st=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28,v:Math.random()*.015+.004}))}
function tick(){const c=getComputedStyle(document.documentElement).getPropertyValue('--star').trim()||'244,240,255';cx.clearRect(0,0,W,H);
for(const s of st){s.p+=s.v;cx.fillStyle=`rgba(${c},${.25+.5*Math.abs(Math.sin(s.p))})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
if(!sh&&Math.random()<.006)sh={x:Math.random()*W*.8,y:Math.random()*H*.35,t:0};
if(sh){sh.t++;const px=sh.x+sh.t*9,py=sh.y+sh.t*5,g=cx.createLinearGradient(px,py,px-90,py-50);g.addColorStop(0,`rgba(${c},.9)`);g.addColorStop(1,`rgba(${c},0)`);cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(px,py);cx.lineTo(px-90,py-50);cx.stroke();if(sh.t>60)sh=null}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(tick)}
addEventListener('resize',size);size();tick();render();
